<!doctype html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Project Case Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <style>
    :root{--surface:#111318;--low:#1a1c20;--container:#1e2024;--high:#282a2e;--lowest:#0c0e12;--ink:#e2e2e8;--muted:#c7c4d7;--outline:#908fa0;--line:#464554;--primary:#c0c1ff;--secondary:#4edea3;--tertiary:#7bd0ff}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:14px/1.55 Inter,Arial,sans-serif}.mono,.micro{font-family:"JetBrains Mono",monospace}.page{width:min(100%,920px);margin:auto;padding:88px 16px 96px}.header{position:fixed;inset:0 0 auto;z-index:5;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(17,19,24,.85);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px)}.head-left,.actions,.chips,.label{display:flex;align-items:center;gap:8px}.icon{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);background:transparent;border:0;border-radius:8px}.icon:hover{color:var(--ink);background:var(--high)}.head-title{font-size:14px;font-weight:600}.micro{font-size:10px;line-height:1.35;color:var(--outline);text-transform:uppercase}.card{margin-bottom:16px;padding:16px;background:var(--low);border:1px solid rgba(255,255,255,.07);border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.14)}.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;top:-72px;right:-72px;width:180px;height:180px;border:1px solid rgba(192,193,255,.22);border-radius:50%;box-shadow:0 0 50px rgba(192,193,255,.08)}.status{display:inline-flex;gap:6px;align-items:center;padding:5px 8px;color:var(--secondary);border:1px solid rgba(78,222,163,.3);background:rgba(78,222,163,.08);border-radius:99px;font:500 10px/1.2 "JetBrains Mono",monospace;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.hero h1{position:relative;z-index:1;margin:16px 0 5px;font-size:29px;line-height:1.18}.lede{position:relative;z-index:1;margin:0;color:var(--muted)}.chips{position:relative;z-index:1;flex-wrap:wrap;margin-top:15px}.chip{padding:5px 8px;color:var(--muted);background:var(--high);border-radius:5px;font:500 10px/1.3 "JetBrains Mono",monospace}.actions{position:relative;z-index:1;flex-wrap:wrap;margin-top:16px}.button{min-height:39px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 11px;color:var(--ink);background:var(--high);border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none}.primary{color:#1000a9;background:var(--primary)}.pending{opacity:.5;cursor:not-allowed}.label{margin:3px 0 10px;color:var(--primary);font:600 10px/1.4 "JetBrains Mono",monospace;text-transform:uppercase}.label span{color:var(--secondary)}h2{margin:0 0 8px;font-size:19px;line-height:1.3}h3{margin:0 0 5px;font-size:13px}p{margin:0;color:var(--muted)}.list{display:grid;gap:8px;margin:13px 0 0;padding:0;list-style:none}.list li{display:flex;gap:8px;color:var(--muted)}.list li:before{content:"›";color:var(--secondary);font-weight:700}.grid{display:grid;gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.sub{padding:12px;background:var(--container);border:1px solid rgba(255,255,255,.06);border-radius:8px}.sub p{font-size:12px}.switch{display:flex;gap:5px;margin:14px 0 12px;padding:4px;background:var(--lowest);border:1px solid rgba(255,255,255,.08);border-radius:8px}.switch button{flex:1;padding:7px;color:var(--muted);background:transparent;border:0;border-radius:5px;font:500 10px/1.3 "JetBrains Mono",monospace}.switch button.active{color:var(--primary);background:var(--high)}.diagram{display:flex;align-items:center;gap:6px;padding:14px;overflow:auto;background:var(--lowest);border:1px solid rgba(255,255,255,.06);border-radius:8px}.node{min-width:112px;padding:10px;color:var(--muted);background:var(--container);border:1px solid var(--line);border-radius:6px;font:500 10px/1.4 "JetBrains Mono",monospace;text-align:center}.node:first-child{color:var(--primary);border-color:rgba(192,193,255,.55)}.node:last-child{color:var(--secondary);border-color:rgba(78,222,163,.55)}.flow{color:var(--outline)}.ascii{display:none;margin:0;padding:13px;overflow:auto;color:var(--secondary);background:var(--lowest);border:1px solid rgba(78,222,163,.25);border-radius:8px;font:11px/1.55 "JetBrains Mono",monospace;white-space:pre-wrap}.ascii.visible{display:block}.hide{display:none}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.empty{min-height:112px;display:grid;place-items:center;padding:10px;color:var(--outline);background:var(--lowest);border:1px dashed var(--line);border-radius:7px;font:500 10px/1.4 "JetBrains Mono",monospace;text-align:center}.callout{padding:12px;color:var(--muted);background:rgba(123,208,255,.07);border-left:2px solid var(--tertiary);font-size:12px}.future{border-color:rgba(192,193,255,.3)}.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.roadmap div{min-height:67px;padding:9px;color:var(--muted);background:var(--container);border-top:2px solid var(--primary);font:11px/1.35 "JetBrains Mono",monospace}.roadmap b{display:block;margin-bottom:4px;color:var(--primary);font-size:10px}.nav{position:fixed;inset:auto 0 0;z-index:5;display:flex;justify-content:center;gap:20px;padding:12px 16px;background:rgba(12,14,18,.88);border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(14px)}.nav a{color:var(--muted);font:500 10px/1.3 "JetBrains Mono",monospace;text-decoration:none}.nav .active{color:var(--primary)}.not-found{padding-top:130px;text-align:center}@media(max-width:560px){.two,.gallery{grid-template-columns:1fr}.roadmap{grid-template-columns:1fr 1fr}.header .micro{display:none}.button{flex:1}.page{padding-top:80px}}
  </style>
</head>
<body>
  <header class="header"><div class="head-left"><a class="icon" href="/" aria-label="Back to projects"><span class="material-symbols-outlined">arrow_back</span></a><div><div class="head-title">Project case study</div><div class="micro" id="header-project">Loading project</div></div></div><span class="micro">STITCH / CASE FILE</span></header>
  <main class="page" id="app"><div class="card">Loading project details...</div></main>
  <nav class="nav"><a href="/">Projects</a><a class="active" href="#overview">Case study</a><a href="#future">Future scope</a></nav>
  <script src="/project-data.js"></script>
  <script>
    const query=new URLSearchParams(location.search);const project=(window.PORTFOLIO_PROJECTS||[]).find(item=>item.slug===query.get('slug'));const app=document.getElementById('app');
    const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));const list=items=>`<ul class="list">${items.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`;const link=(type,label,icon,primary=false)=>{const url=project.links[type];return url?`<a class="button ${primary?'primary':''}" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><span class="material-symbols-outlined">${icon}</span>${label}</a>`:`<span class="button ${primary?'primary ':''}pending" aria-disabled="true" title="Add this URL in project-data.js"><span class="material-symbols-outlined">${icon}</span>${label} pending</span>`};
    if(!project){app.innerHTML='<section class="not-found"><p class="label">PROJECT REGISTRY</p><h1>Project not found</h1><p>Return to the projects index and select an available case study.</p><p style="margin-top:18px"><a class="button primary" href="/">Back to projects</a></p></section>';}
    else{document.title=project.name+' | Project Case Study';document.getElementById('header-project').textContent=project.name;const nodes=project.architecture.map((item,index)=>`<div class="node">${esc(item)}</div>${index<project.architecture.length-1?'<div class="flow">→</div>':''}`).join('');app.innerHTML=`
      <section class="card hero" id="overview"><span class="status"><span class="dot"></span>${esc(project.status)} case file</span><h1>${esc(project.name)}</h1><p class="lede">${esc(project.shortDescription)}</p><div class="chips">${project.technologies.map(item=>`<span class="chip">${esc(item)}</span>`).join('')}</div><div class="actions">${link('live','Live production','rocket_launch',true)}${link('github','GitHub repository','code')}<a class="button" href="#architecture"><span class="material-symbols-outlined">account_tree</span>Architecture</a></div></section>
      <section class="card"><p class="label">01 <span>/</span> Overview</p><h2>Problem statement</h2><p>${esc(project.overview)}</p><div class="callout" style="margin-top:13px">${esc(project.problem)}</div></section>
      <section class="card"><p class="label">02 <span>/</span> Objectives &amp; key features</p><div class="grid two"><div class="sub"><h3>Objectives</h3>${list(project.objectives)}</div><div class="sub"><h3>Current features</h3>${list(project.features)}</div></div></section>
      <section class="card"><p class="label">03 <span>/</span> Technologies &amp; tools</p><div class="chips">${project.technologies.map(item=>`<span class="chip">${esc(item)}</span>`).join('')}</div></section>
      <section class="card"><p class="label">04 <span>/</span> Application gallery</p><div class="gallery"><div class="empty">APPLICATION CAPTURE<br>NOT YET ADDED</div><div class="empty">APPLICATION CAPTURE<br>NOT YET ADDED</div><div class="empty">APPLICATION CAPTURE<br>NOT YET ADDED</div></div><p class="micro" style="margin-top:9px">Verified application screenshots are pending.</p></section>
      <section class="card" id="architecture"><p class="label">05 <span>/</span> Current system architecture</p><h2>Architecture &amp; data flow</h2><div class="switch"><button class="active" data-target="current-visual">GUI topology</button><button data-target="current-ascii">ASCII topology</button></div><div class="diagram" id="current-visual">${nodes}</div><pre class="ascii" id="current-ascii">CLIENT  →  ${esc(project.architecture.join('  →  '))}  →  OBSERVABILITY</pre><div class="grid two" style="margin-top:12px"><div class="sub"><h3>Frontend architecture</h3><p>${esc(project.frontend)}</p></div><div class="sub"><h3>Backend architecture</h3><p>${esc(project.backend)}</p></div><div class="sub"><h3>Data architecture</h3><p>${esc(project.database)}</p></div><div class="sub"><h3>API integrations</h3>${list(project.integrations)}</div></div></section>
      <section class="card"><p class="label">06 <span>/</span> End-to-end workflow</p><div class="grid">${project.workflow.map((step,index)=>`<div class="sub"><span class="micro">STEP ${String(index+1).padStart(2,'0')}</span><p style="margin-top:4px">${esc(step)}</p></div>`).join('')}</div></section>
      <section class="card"><p class="label">07 <span>/</span> Technical implementation</p>${list(project.implementation)}</section>
      <section class="card"><p class="label">08 <span>/</span> Challenges &amp; solutions</p><div class="grid">${project.challenges.map(item=>`<div class="sub"><h3>${esc(item.issue)}</h3><p><b style="color:var(--secondary)">Solution:</b> ${esc(item.solution)}</p></div>`).join('')}</div></section>
      <section class="card future" id="future"><p class="label">09 <span>/</span> Future scope / proposed</p><h2>What is planned, not yet implemented</h2><p>Everything in this section is proposed work. It does not describe a current production capability.</p><div class="callout" style="margin-top:13px"><b>Current limitations</b>${list(project.limitations)}</div><div class="switch"><button class="active" data-target="future-visual">Proposed architecture</button><button data-target="future-ascii">Future workflow</button></div><div class="diagram" id="future-visual"><div class="node">Current platform</div><div class="flow">→</div><div class="node">Proposed enhancements</div><div class="flow">→</div><div class="node">Expected outcomes</div></div><pre class="ascii" id="future-ascii">CURRENT LIMITATIONS  →  VALIDATE PROPOSAL  →  PHASED ROLLOUT  →  MEASURED OUTCOME</pre><div class="grid" style="margin-top:12px">${project.future.map(item=>`<div class="sub"><span class="micro" style="color:var(--tertiary)">PROPOSED ENHANCEMENT</span><h3 style="margin-top:5px">${esc(item.title)}</h3><p><b>Why:</b> ${esc(item.why)}</p><p style="margin-top:6px"><b>Implementation:</b> ${esc(item.how)}</p><p style="margin-top:6px"><b>Technology:</b> ${esc(item.technology)}</p><p style="margin-top:6px"><b>Expected outcome:</b> ${esc(item.outcome)}</p></div>`).join('')}</div><div class="roadmap">${project.roadmap.map((item,index)=>`<div><b>PHASE ${index+1}</b>${esc(item)}</div>`).join('')}</div></section>`;document.querySelectorAll('.switch button').forEach(button=>button.addEventListener('click',()=>{const prefix=button.dataset.target.startsWith('future')?'future':'current';const visual=button.dataset.target.endsWith('visual');document.getElementById(prefix+'-visual').classList.toggle('hide',!visual);document.getElementById(prefix+'-ascii').classList.toggle('visible',visual===false);button.parentElement.querySelectorAll('button').forEach(item=>item.classList.toggle('active',item===button));}));}
  </script>
</body>
</html>
